<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper to Dataset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Paper to Dataset</h1>

  <div class="checks">
    <label class="check"><input type="checkbox" id="useSections" checked> Section pairs (long answers)</label>
    <label class="check"><input type="checkbox" id="useSentences" checked> Sentence pairs (short, specific)</label>
  </div>

  <input type="file" id="pdfFile" accept="application/pdf" multiple>
  <button id="stopBtn" disabled>Stop</button>

  <div id="progressWrap" hidden>
    <div class="bar"><div id="barFill"></div></div>
    <p id="progressText"></p>
  </div>

  <p id="status"></p>
  <ul id="fileList"></ul>

  <div class="checks">
    <label class="check">Validation share (%)
      <input type="number" id="valPercent" value="10" min="0" max="50" step="1" class="narrow">
    </label>
    <label class="check">Format
      <select id="fileFormat">
        <option value="json">JSON</option>
        <option value="jsonl">JSONL</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="includeMeta"> Include metadata (source paper, rule, section)</label>
  </div>

  <p id="splitInfo"></p>

  <div>
    <button id="dlTrain" disabled>Download training file</button>
    <button id="dlVal" disabled>Download validation file</button>
  </div>

  <div id="preview"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
