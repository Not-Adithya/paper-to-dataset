<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper to Dataset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Paper to Dataset</h1>

  <input type="file" id="pdfFile" accept="application/pdf">
  <p id="status"></p>

  <div>
    <button id="dlJson" disabled>Download JSON</button>
    <button id="dlJsonl" disabled>Download JSONL</button>
  </div>
  <label class="check"><input type="checkbox" id="includeMeta"> Include metadata (rule, section)</label>

  <div id="preview"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
