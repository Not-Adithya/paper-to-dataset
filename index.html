<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper to Dataset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Paper to Dataset</h1>

  <input type="file" id="pdfFile" accept="application/pdf" multiple>
  <button id="stopBtn" disabled>Stop</button>

  <div id="progressWrap" hidden>
    <div class="bar"><div id="barFill"></div></div>
    <p id="progressText"></p>
  </div>

  <p id="status"></p>
  <ul id="fileList"></ul>

  <div>
    <button id="dlJson" disabled>Download JSON</button>
    <button id="dlJsonl" disabled>Download JSONL</button>
  </div>
  <label class="check"><input type="checkbox" id="includeMeta"> Include metadata (source paper, rule, section)</label>

  <div id="preview"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
