<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper to Dataset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Paper to Dataset</h1>

  <label>Research paper (PDF)
    <input type="file" id="pdfFile" accept="application/pdf">
  </label>

  <label>API key (stays in your browser, never saved)
    <input type="password" id="apiKey" autocomplete="off">
  </label>

  <div class="row">
    <label>Model
      <input type="text" id="modelName">
    </label>
    <label>Number of pairs wanted
      <input type="number" id="targetPairs" min="1" max="1000">
    </label>
    <label>Delay between requests (seconds)
      <input type="number" id="delaySec" min="0" step="0.5">
    </label>
  </div>

  <div id="plan"></div>

  <div>
    <button id="generateBtn">Generate dataset</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="downloadBtn" disabled>Download JSON</button>
    <button id="downloadJsonlBtn" disabled>Download JSONL</button>
  </div>
  <label class="check"><input type="checkbox" id="includeMeta" checked> Include metadata (task type, section, model, prompt version)</label>

  <div id="progressWrap" hidden>
    <div class="bar"><div id="barFill"></div></div>
    <div id="progressText"></div>
  </div>

  <details>
    <summary>Debug tools</summary>
    <div class="row">
      <label>Chunk number to test
        <input type="number" id="chunkNo" value="3" min="1">
      </label>
    </div>
    <button id="previewBtn">Preview chunks</button>
    <button id="testBtn">Test 1 chunk</button>
    <button id="listBtn">List models</button>
  </details>

  <pre id="output">Waiting for a file...</pre>

  <script type="module" src="js/app.js"></script>
</body>
</html>
